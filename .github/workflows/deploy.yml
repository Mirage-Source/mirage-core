# Retired 2026-08-26: Mirage is no longer live (no VPS to deploy to).
# Auto-deploy-on-push disabled; workflow_dispatch kept so it can be re-armed
# by restoring the `push` trigger below if the sensor comes back online.
name: Deploy MIRAGE
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Go binary
        working-directory: .
        run: go build ./...
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            cd ~/mirage-core
            git fetch origin main
            git reset --hard origin/main
            docker compose up --build -d
            docker compose ps
