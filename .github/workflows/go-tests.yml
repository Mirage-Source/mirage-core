name: Go Tests

on:
  push:
    branches: [main]
    paths: ["cmd/**", "internal/**", "go.mod", "go.sum"]
  pull_request:
    paths: ["cmd/**", "internal/**", "go.mod", "go.sum"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
