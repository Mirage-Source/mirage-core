name: Update Public Stats

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  SENSOR_API: http://127.0.0.1:18080
  SENSOR_GENERATION: g2

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Checkout main (README + update script)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Open forward to the sensor API
        uses: ./main/.github/actions/sensor-api-tunnel
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          user: ${{ secrets.SENSOR_API_USER }}
          key: ${{ secrets.SENSOR_API_KEY_SSH }}
          known-hosts: ${{ secrets.SENSOR_KNOWN_HOSTS }}

      - name: Fetch stats from API
        working-directory: gh-pages
        run: |
          set -euo pipefail
          curl -fsS \
            -H "X-API-Key: ${{ secrets.API_KEY }}" \
            "${SENSOR_API}/api/stats" \
            -o stats.json
          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg g "${SENSOR_GENERATION}" \
             '. + {generated_at: $t, sensor_generation: $g}' stats.json > stats.json.tmp
          mv stats.json.tmp stats.json

      - name: Commit updated stats (gh-pages)
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "chore: update public stats [skip ci]"
          git push

      - name: Update README live findings (main)
        working-directory: main
        run: |
          python3 scripts/update_readme_stats.py --stats ../gh-pages/stats.json --readme README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update README live findings [skip ci]"
          git push
