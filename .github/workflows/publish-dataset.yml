name: Publish Dataset

permissions:
  contents: write

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

env:
  SENSOR_API: http://127.0.0.1:18080
  SENSOR_GENERATION: g2

jobs:
  publish-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (scripts + pinned geo data)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout gh-pages (publish target)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r main/scripts/requirements.txt

      - name: Open forward to the sensor API
        uses: ./main/.github/actions/sensor-api-tunnel
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          user: ${{ secrets.SENSOR_API_USER }}
          key: ${{ secrets.SENSOR_API_KEY_SSH }}
          known-hosts: ${{ secrets.SENSOR_KNOWN_HOSTS }}

      - name: Determine next version number
        id: version
        run: |
          set -euo pipefail
          mkdir -p gh-pages/dataset
          last=$(ls gh-pages/dataset \
                 | grep -E "^${SENSOR_GENERATION}-v[0-9]+$" \
                 | sed "s/^${SENSOR_GENERATION}-v//" \
                 | sort -n | tail -1 || true)
          next=$(( ${last:-0} + 1 ))
          echo "version=${SENSOR_GENERATION}-v${next}" >> "$GITHUB_OUTPUT"

      - name: Run export
        working-directory: main
        run: |
          python3 scripts/export_dataset.py \
            --api-url "${SENSOR_API}" \
            --api-key "${{ secrets.API_KEY }}" \
            --geo-asn-csv data/geo/dbip-asn-lite.csv \
            --geo-country-csv data/geo/dbip-country-lite.csv \
            --out-dir ../gh-pages/dataset \
            --version "${{ steps.version.outputs.version }}" \
            --sensor-generation "${SENSOR_GENERATION}"

      - name: Run commands export
        working-directory: main
        run: |
          python3 scripts/export_commands_dataset.py \
            --api-url "${SENSOR_API}" \
            --api-key "${{ secrets.API_KEY }}" \
            --out-dir ../gh-pages/dataset \
            --version "${{ steps.version.outputs.version }}" \
            --ip-salt "${{ secrets.IP_SALT }}"

      - name: Generate report
        working-directory: main
        run: |
          python3 scripts/generate_report.py \
            --dataset-dir "../gh-pages/dataset/${{ steps.version.outputs.version }}"

      - name: Update "latest" pointer
        working-directory: gh-pages/dataset
        run: |
          rm -rf latest
          cp -r "${{ steps.version.outputs.version }}" latest

      - name: Commit and push
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dataset/
          git diff --cached --quiet || git commit -m "chore: publish dataset ${{ steps.version.outputs.version }} [skip ci]"
          git push
