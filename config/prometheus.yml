global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: mirage
    static_configs:
      - targets: ['mirage-api:8080']
    metrics_path: /metrics
    # mirage-api requires an API key (see cmd/api/main.go); the token is
    # written to this path at container start from the API_KEY env var
    # (docker-compose.yml), never committed here.
    authorization:
      credentials_file: /prometheus/api_key_runtime
