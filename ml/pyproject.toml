[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage-ml"
version = "0.2.0"
description = "MIRAGE -- machine-learning intelligence layer for an AI SSH honeypot (Phase 1 data + tokenizer, Phase 2 embeddings + trajectory, Phase 3 contrastive re-ID, Phase 4 real-time intelligence, Phase 5 adaptive-deception RL)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Devang" }]
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
# Phase-2 neural models, training, and visualization.
models = [
    "torch>=2.1",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
]
# Phase-4 LLM threat-intel summaries (degrades to a template if absent).
intel = ["anthropic>=0.40"]
# Nicer 2-D embedding maps + experiment logging (both degrade gracefully if absent).
viz = ["umap-learn>=0.5"]
logging = ["wandb>=0.16"]
# Parquet log ingestion.
parquet = ["pandas>=1.5", "pyarrow>=10"]
# Real-data re-ID: pulling sessions directly from a Postgres backup/restore
# (mirage-core has no live API once the sensor is offline -- see
# mirage.reid.real_db).
real-data = ["psycopg2-binary>=2.9"]
# Tests.
dev = ["pytest>=7"]

[project.scripts]
mirage-session-stats = "mirage.analysis.session_stats:main"
mirage-train = "mirage.training.train:main"
mirage-visualize = "mirage.viz.visualize:main"
mirage-reid = "mirage.reid.train:main"
mirage-deception = "mirage.deception.train:main"
mirage-reid-campaign = "mirage.reid.real_db:main_detect_campaign"
mirage-reid-export = "mirage.reid.real_db:main_export_corpus"
mirage-reid-real = "mirage.reid.real_train:main"

[tool.setuptools.packages.find]
include = ["mirage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
