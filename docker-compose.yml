services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-mirage}
      POSTGRES_USER: ${DB_USER:-mirage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mirage} -d ${DB_NAME:-mirage}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M

  mirage-core:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-mirage}
      DB_NAME: ${DB_NAME:-mirage}
      # Adaptive deception -- off by default (see .env.example).
      # Deliberately NOT a `depends_on` on mirage-deception below: the SSH
      # server must start and run identically whether or not that service
      # exists, builds, or is healthy. deception.Client fails safe to
      # ActionMinimal on any error, so this is safe to leave wired even when
      # MIRAGE_DECEPTION_ENABLED is false or the service is briefly down.
      MIRAGE_DECEPTION_ENABLED: "${MIRAGE_DECEPTION_ENABLED:-false}"
      MIRAGE_DECEPTION_URL: "http://mirage-deception:8787"
      MIRAGE_DECEPTION_TIMEOUT_MS: "${MIRAGE_DECEPTION_TIMEOUT_MS:-200}"
      MIRAGE_DECEPTION_APPLY_ACTIONS: "${MIRAGE_DECEPTION_APPLY_ACTIONS:-false}"
      # Identifies this deployment's heartbeat rows for the data-validity
      # dashboard's downtime-vs-silence check (internal/validity). Only
      # matters once more than one sensor writes into a shared/aggregated
      # setup -- a single deployment can leave this at the default.
      SENSOR_ID: "${SENSOR_ID:-default}"
    volumes:
      - ./config/hostkey:/app/config/hostkey:ro
    ports:
      - "22:2222"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  ml-worker:
    build:
      context: .
      dockerfile: bridge/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-mirage}
      DB_NAME: ${DB_NAME:-mirage}
      BRIDGE_POLL_INTERVAL_S: "10"
      BRIDGE_BATCH_SIZE: "32"
      # MIRAGE_MODEL_CHECKPOINT: /app/artifacts/embedder/best.pt
      # MIRAGE_TOKENIZER_DIR: /app/artifacts/embedder/tokenizer
      # MIRAGE_MODEL_VERSION: mirage-emb-v1
      # Phase-4 LLM threat-intel summaries -- off by default since it costs
      # real API calls. To enable, uncomment and put ANTHROPIC_API_KEY in .env:
      # MIRAGE_INTEL_USE_LLM: "1"
      # MIRAGE_INTEL_MODEL: claude-opus-4-8
      # STIX 2.1 export is pure-stdlib, deterministic, and has no external
      # dependency or cost, so unlike the LLM flag above it's on by default.
      MIRAGE_STIX_ENABLED: "1"
    volumes:
      - ./artifacts:/app/artifacts:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M

  mirage-deception:
    # Reuses the bridge image -- `pip install /app/ml` in bridge/Dockerfile
    # already installs mirage.deception, so no new Dockerfile is needed; only
    # the entrypoint differs (serve.py's HTTP loop instead of the bridge's
    # poll loop).
    build:
      context: .
      dockerfile: bridge/Dockerfile
    entrypoint: ["python", "-m", "mirage.deception.serve"]
    # No depends_on and no external port publish: mirage-core reaches this by
    # service name on the compose network, and it needs nothing from
    # postgres. Not required for mirage-core to start -- see the comment on
    # mirage-core's MIRAGE_DECEPTION_* block above.
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      # Checkpoints are committed under ml/mirage/deception/ and land at
      # /app/ml/mirage/deception/ inside the image via bridge/Dockerfile's
      # `COPY ml/ /app/ml/` -- no host-side artifact file needed by default.
      # Override to /app/artifacts/deception/<file> (and populate ./artifacts/)
      # to run a newer checkpoint without rebuilding the image.
      MIRAGE_DECEPTION_CHECKPOINT: "${MIRAGE_DECEPTION_CHECKPOINT:-/app/ml/mirage/deception/ppo.pt}"
      MIRAGE_DECEPTION_ALGO: "${MIRAGE_DECEPTION_ALGO:-ppo}"
      MIRAGE_DECEPTION_PORT: "8787"
      MIRAGE_DECEPTION_MAX_STEPS: "${MIRAGE_DECEPTION_MAX_STEPS:-25}"
      MIRAGE_DECEPTION_SESSION_TTL_SECONDS: "${MIRAGE_DECEPTION_SESSION_TTL_SECONDS:-900}"
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  mirage-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-mirage}
      DB_NAME: ${DB_NAME:-mirage}
      API_KEY: ${API_KEY}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  postgres_data:
